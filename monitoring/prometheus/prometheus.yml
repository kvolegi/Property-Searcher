global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'property-searcher-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:8080', 'host.docker.internal:8080']
        labels:
          application: 'property-seacher-backend'
          environment: 'production'
