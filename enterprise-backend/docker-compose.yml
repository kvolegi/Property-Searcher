version: '3.8'

services:
  app:
    build: .
    container_name: property-seacher-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-Property_Searcher_bot}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-YOUR_TELEGRAM_BOT_TOKEN}
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/property_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: property-seacher-postgres
    restart: always
    environment:
      - POSTGRES_DB=property_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
