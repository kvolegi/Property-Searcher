name: Release / Publish Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Core Desktop Executable JAR
        working-directory: core-desktop
        run: mvn package -DskipTests --batch-mode

      - name: Build Enterprise Backend Fat JAR
        working-directory: enterprise-backend
        run: mvn package -DskipTests --batch-mode

      - name: Assemble Release Assets
        run: |
          mkdir -p release-assets
          cp core-desktop/target/PS-3.0.jar release-assets/PropertySeacher-Universal.jar
          cp enterprise-backend/target/property-seacher-backend-3.0.0.jar release-assets/PropertySeacher-Enterprise-Server.jar
          cd release-assets && zip -r PropertySeacher-Universal-Binaries.zip ./*

      - name: Upload Release Binaries to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PropertySeacher-Release-Binaries
          path: release-assets/
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/PropertySeacher-Universal.jar
            release-assets/PropertySeacher-Enterprise-Server.jar
            release-assets/PropertySeacher-Universal-Binaries.zip
          generate_release_notes: true
